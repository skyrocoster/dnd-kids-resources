<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Detail Regions — Monster Stat Block Component</title>
  <style>
    :root {
      color-scheme: dark;
      --surface: #1c1b1f; --surface-2: #28262e; --surface-3: #2e2b35; --outline: #49454f; --text: #e6e1e6; --accent: #a0d0be;
      --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem; --space-5: 1.5rem; --radius-md: .375rem; --radius-lg: .75rem;
      font-family: system-ui, "Segoe UI", sans-serif; color: var(--text); background: var(--surface); font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface); }
    .shell { width: min(620px, 100%); margin: 0 auto; padding: .75rem 1rem var(--space-5); }
    .card { padding: 1rem; border: 1px solid var(--outline); border-radius: var(--radius-lg); background: var(--surface-2); }
    h2 { margin: 0 0 var(--space-2); color: var(--accent); font-size: .875rem; font-weight: 500; line-height: 1.25rem; }
    h3 { margin: 0 0 var(--space-1); font-size: .875rem; font-weight: 600; line-height: 1.25rem; }
    p { margin: var(--space-2) 0 0; font-size: .875rem; line-height: 1.25rem; overflow-wrap: anywhere; }
    strong { font-weight: 600; }
    .regions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); }
    .panel { min-width: 0; padding: var(--space-3); border: 1px solid var(--outline); border-radius: var(--radius-md); background: var(--surface-3); }
    @media (max-width: 500px) { .regions { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <article class="card">
      <div class="regions">
        <section class="panel" aria-labelledby="actions-title">
          <h2 id="actions-title">Actions</h2>
          <h3>Attacks &amp; Actions</h3>
          <p><strong>Bite:</strong> Melee Weapon Attack.</p>
        </section>
        <section class="panel" aria-labelledby="defenses-title">
          <h2 id="defenses-title">Defenses</h2>
          <p><strong>Senses</strong> darkvision 120 ft., passive Perception 18</p>
        </section>
        <section class="panel" aria-labelledby="lore-title">
          <h2 id="lore-title">Lore</h2>
          <p><strong>Fire Breath:</strong> The dragon exhales fire in a cone.</p>
          <p><strong>Languages</strong> Common, Draconic</p>
        </section>
      </div>
    </article>
  </main>
</body>
</html>
