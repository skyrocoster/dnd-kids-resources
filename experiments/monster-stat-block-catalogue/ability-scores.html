<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ability Scores — Monster Stat Block Component</title>
  <style>
    :root {
      color-scheme: dark;
      --surface: #1c1b1f; --surface-2: #28262e; --surface-3: #2e2b35; --outline: #49454f; --text: #e6e1e6; --muted: #cac4d0; --accent: #a0d0be;
      --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem; --space-5: 1.5rem; --radius-md: .375rem; --radius-lg: .75rem;
      font-family: system-ui, "Segoe UI", sans-serif; color: var(--text); background: var(--surface); font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface); }
    .shell { width: min(620px, 100%); margin: 0 auto; padding: .75rem 1rem var(--space-5); }
    .card { padding: 1rem; border: 1px solid var(--outline); border-radius: var(--radius-lg); background: var(--surface-2); }
    h2 { margin: 0 0 var(--space-2); color: var(--accent); font-size: .875rem; font-weight: 500; line-height: 1.25rem; }
    dl { margin: 0; }
    dt { color: var(--muted); font-size: .6875rem; line-height: 1rem; letter-spacing: .05em; text-transform: uppercase; }
    dd { margin: var(--space-1) 0 0; font-size: .875rem; line-height: 1.25rem; overflow-wrap: anywhere; }
    .scores { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--space-2); }
    .score { min-width: 0; padding: var(--space-2); border: 1px solid var(--outline); border-radius: var(--radius-md); background: var(--surface-3); text-align: center; }
    .score dd { margin-top: var(--space-1); font-size: 1.25rem; font-weight: 600; line-height: 1.5rem; }
    .mod { display: block; color: var(--muted); font-size: .8125rem; font-weight: 400; line-height: 1rem; }
    @media (max-width: 500px) { .scores { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 360px) { .scores { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <article class="card">
      <section aria-labelledby="abilities-title">
        <h2 id="abilities-title">Abilities</h2>
        <dl class="scores" aria-label="Ability scores and modifiers">
          <div class="score"><dt>STR</dt><dd>23 <span class="mod">+6</span></dd></div>
          <div class="score"><dt>DEX</dt><dd>10 <span class="mod">+0</span></dd></div>
          <div class="score"><dt>CON</dt><dd>21 <span class="mod">+5</span></dd></div>
          <div class="score"><dt>INT</dt><dd>14 <span class="mod">+2</span></dd></div>
          <div class="score"><dt>WIS</dt><dd>11 <span class="mod">+0</span></dd></div>
          <div class="score"><dt>CHA</dt><dd>19 <span class="mod">+4</span></dd></div>
        </dl>
      </section>
    </article>
  </main>
</body>
</html>
