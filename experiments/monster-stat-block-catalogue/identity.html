<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Identity — Monster Stat Block Component</title>
  <style>
    :root {
      color-scheme: dark;
      --surface: #1c1b1f; --surface-2: #28262e; --outline: #49454f; --text: #e6e1e6; --muted: #cac4d0; --accent: #a0d0be;
      --accent-container: #1d4f40; --accent-text: #bcecd9;
      --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem; --space-5: 1.5rem;
      --radius-sm: .25rem; --radius-md: .375rem; --radius-lg: .75rem;
      font-family: system-ui, "Segoe UI", sans-serif; color: var(--text); background: var(--surface); font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface); }
    .shell { width: min(620px, 100%); margin: 0 auto; padding: var(--space-3) 1rem var(--space-5); }
    .card { padding: var(--space-4); border: 1px solid var(--outline); border-radius: var(--radius-lg); background: var(--surface-2); }
    .identity { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); }
    .eyebrow { margin: 0 0 var(--space-1); color: var(--accent); font-size: .6875rem; line-height: 1rem; letter-spacing: .05em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 500; line-height: 2rem; }
    .kind { margin: var(--space-1) 0 0; color: var(--muted); font-size: .875rem; line-height: 1.25rem; font-style: italic; }
    .cr { flex: none; margin: 0; padding: var(--space-1) var(--space-2); border-radius: 999px; background: var(--accent-container); color: var(--accent-text); font-size: .875rem; font-weight: 600; }
    @media (max-width: 500px) { .identity { display: block; } .cr { display: inline-block; margin-top: var(--space-2); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <article class="card" aria-labelledby="monster-name">
      <header class="identity">
        <div>
          <p class="eyebrow">Dragon</p>
          <h1 id="monster-name">Young Red Dragon</h1>
          <p class="kind">large, dragon, chaotic evil</p>
        </div>
        <p class="cr">CR 10</p>
      </header>
    </article>
  </main>
</body>
</html>
