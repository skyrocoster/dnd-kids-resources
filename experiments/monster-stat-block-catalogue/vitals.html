<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Vitals — Monster Stat Block Composition</title>
  <style>
    :root {
      color-scheme: dark;
      --surface: #1c1b1f; --surface-2: #28262e; --surface-3: #2e2b35; --outline: #49454f;
      --text: #e6e1e6; --muted: #cac4d0; --accent: #a0d0be;
      --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem; --space-5: 1.5rem;
      --radius-md: .375rem; --radius-lg: .75rem;
      font-family: system-ui, "Segoe UI", sans-serif; color: var(--text); background: var(--surface); font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface); }
    .shell { width: min(620px, 100%); margin: 0 auto; padding: var(--space-3) 1rem var(--space-5); }
    .card { padding: var(--space-4); border: 1px solid var(--outline); border-radius: var(--radius-lg); background: var(--surface-2); }
    .vitals { display: grid; grid-template-columns: .75fr 1.15fr 1.25fr; grid-template-rows: repeat(2, auto); gap: var(--space-2); margin: 0; }
    .vital { display: grid; grid-row: span 2; grid-template-rows: subgrid; align-items: baseline; min-width: 0; margin: 0; padding: var(--space-2) var(--space-2) var(--space-3); border-top: 1px solid var(--accent); background: var(--surface-3); }
    dt { color: var(--muted); font-size: .6875rem; line-height: 1rem; letter-spacing: .05em; text-transform: uppercase; }
    dd { margin: var(--space-1) 0 0; font-size: .875rem; line-height: 1.25rem; overflow-wrap: anywhere; }
    .vital dd { margin-top: 0; font-size: 1.25rem; font-weight: 600; line-height: 1.5rem; }
    .note { color: var(--muted); font-size: .8125rem; font-weight: 400; }
    .vital-hp dd { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-2); font-size: 2rem; line-height: 2.25rem; }
    .formula { color: var(--muted); font-size: .8125rem; font-weight: 400; }
    @media (max-width: 500px) {
      .vitals { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, auto); }
      .vital-hp { order: -1; grid-column: 1 / -1; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <article class="card">
      <dl class="vitals" aria-label="Combat statistics">
        <div class="vital"><dt>AC</dt><dd>18 <span class="note">(natural armor)</span></dd></div>
        <div class="vital vital-hp"><dt>HP</dt><dd>178 <span class="formula">(17d10 + 85)</span></dd></div>
        <div class="vital"><dt>Speed</dt><dd>40 ft., fly 80 ft.</dd></div>
      </dl>
    </article>
  </main>
</body>
</html>
